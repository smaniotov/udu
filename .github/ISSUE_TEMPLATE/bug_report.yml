name: Bug report
description: Report a problem with udu (sound, capture, TUI, or the service).
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. `udu` is maintained by one person in spare
        time, so the fields below matter a lot — they're usually the
        difference between a fix in a day and a bug that sits unreproduced for
        weeks.
  - type: input
    id: version
    attributes:
      label: udu version
      description: Output of `udu --version`, or the git commit/tag you built from.
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Linux distribution and version
      placeholder: e.g. Fedora 41, Arch (rolling), Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Desktop session
      description: Is your session Wayland or X11?
      options:
        - Wayland
        - X11
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: audio-server
    attributes:
      label: Audio server
      options:
        - PipeWire
        - PulseAudio
        - ALSA (no server)
        - Not sure
    validations:
      required: true
  - type: input
    id: keyboard-device
    attributes:
      label: Keyboard device
      description: >
        The device name as shown in the TUI's device list, or the relevant
        line from `cat /proc/bus/input/devices`.
      placeholder: e.g. "AT Translated Set 2 keyboard"
    validations:
      required: true
  - type: dropdown
    id: service-running
    attributes:
      label: Is the udu.service running?
      description: Output of `systemctl --user status udu.service`.
      options:
        - "Yes — active (running)"
        - "No — inactive or failed"
        - Not sure / haven't checked
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false
  - type: textarea
    id: journal
    attributes:
      label: Relevant journal output
      description: >
        Output of `journalctl --user -u udu.service -b --no-pager` (or the
        lines around when the problem happened). Please redact anything
        personal.
      render: shell
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Soundpack in use, other audio apps running, anything unusual about your setup.
    validations:
      required: false
